name: Build FOX V12 APK

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/build-fox.yml'
      - 'FOX_AWG_Experimental.apk'
      - 'FOX_AWG_Private_Project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
          log-accepted-android-sdk-licenses: false

      - name: Prepare build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tools output
          unzip -q FOX_AWG_Private_Project.zip -d work/project

          curl --fail --location --retry 3 \
            --output work/tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar

          shizuku_version=13.1.5
          for artifact in api provider aidl shared; do
            curl --fail --location --retry 3 \
              --output "work/tools/shizuku-${artifact}.aar" \
              "https://repo.maven.apache.org/maven2/dev/rikka/shizuku/${artifact}/${shizuku_version}/${artifact}-${shizuku_version}.aar"
            unzip -p "work/tools/shizuku-${artifact}.aar" classes.jar > "work/tools/shizuku-${artifact}.jar"
          done

          curl --fail --location --retry 3 \
            --output work/tools/androidx-annotation.jar \
            https://dl.google.com/dl/android/maven2/androidx/annotation/annotation/1.3.0/annotation-1.3.0.jar

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar work/tools/apktool.jar d -r FOX_AWG_Experimental.apk -o work/decoded > work/decode.log 2>&1
          python3 scripts/repair_startup.py work/decoded output/startup-patch.json
          python3 scripts/patch_shizuku_manifest.py work/decoded/AndroidManifest.xml
          bash scripts/build_presentation.sh
          java -jar work/tools/apktool.jar b work/decoded -o work/rebuilt.apk
          python3 scripts/repack_startup.py FOX_AWG_Experimental.apk work/rebuilt.apk work/unsigned.apk

          fox_build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$fox_build_tools/zipalign" -P 16 -f 4 work/unsigned.apk work/aligned.apk
          java -jar "$fox_build_tools/lib/apksigner.jar" sign \
            --ks work/project/signing/private-build-signing.p12 \
            --ks-pass pass:fox-private-build \
            --out output/FOX_V12_Modern.apk \
            work/aligned.apk
          sha256sum output/FOX_V12_Modern.apk > output/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOX-V12-Modern
          path: output/
          if-no-files-found: error
          retention-days: 30
